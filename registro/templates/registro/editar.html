{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar estudiante</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Reset & Base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #1A1A18; /* Tono oscuro de las togas */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1rem;
            
            /* Fondo de pantalla con la imagen local */
            background-image: url("{% static 'img/djangoimg.jpg' %}");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        /* Mensajes de Django (Adaptado para errores con el nuevo rojo) */
        .messages-list {
            list-style: none;
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .messages-list li {
            padding: 0.875rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 600;
            background-color: #FDECEE;
            color: #9B1B22;
            border: 1px solid #FAD4D8;
            display: flex;
            align-items: center;
        }

        /* Tarjeta del formulario */
        .card {
            background: #FCFBF9; /* Blanco cálido del edificio */
            border-radius: 1rem;
            border: 1px solid #F2EAE4;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .card-header {
            padding: 2rem 2rem 1.5rem 2rem;
            background: linear-gradient(to bottom, #FFFFFF, #FCFBF9);
            border-bottom: 1px solid #F2EAE4;
        }

        .icon-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 0.75rem;
            background-color: #FDECEE;
            color: #9B1B22; /* Rojo carmesí de las estolas */
            margin-bottom: 1rem;
        }

        .icon-badge svg {
            width: 22px;
            height: 22px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1A1A18;
            letter-spacing: -0.025em;
            margin-bottom: 0.25rem;
        }

        .card-header p {
            font-size: 0.875rem;
            color: #6D6863;
        }

        /* Cuerpo del formulario */
        .card-body {
            padding: 1.75rem 2rem 2rem 2rem;
        }

        form p {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
        }

        form label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #4A4642;
            margin-bottom: 0.375rem;
        }

        form input[type="text"],
        form input[type="email"],
        form input[type="number"],
        form select {
            width: 100%;
            padding: 0.65rem 0.875rem;
            border-radius: 0.625rem;
            border: 1px solid #D6CEC8;
            background-color: #FFFFFF;
            color: #1A1A18;
            font-size: 0.875rem;
            font-family: inherit;
            transition: all 0.15s ease;
        }

        form input:focus:not(.input-readonly),
        form select:focus {
            outline: none;
            border-color: #9B1B22;
            box-shadow: 0 0 0 3px rgba(155, 27, 34, 0.12);
        }

        /* Campos bloqueados */
        .input-readonly {
            background-color: #F8F6F4 !important;
            color: #8C867F !important;
            cursor: not-allowed;
            border-color: #E6E0DA !important;
        }
        
        .input-readonly:focus {
            outline: none;
        }

        hr.divider {
            border: 0;
            border-top: 1px dashed #D6CEC8;
            margin: 1.75rem 0;
        }

        /* Botón Guardar */
        .btn-submit {
            width: 100%;
            padding: 0.75rem 1.25rem;
            background-color: #9B1B22; /* Rojo carmesí principal */
            color: #FFFFFF;
            font-size: 0.875rem;
            font-weight: 600;
            border: none;
            border-radius: 0.625rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background-color 0.15s ease, transform 0.1s ease;
            box-shadow: 0 2px 4px rgba(155, 27, 34, 0.2);
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: #7A151A;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        /* Pie de la tarjeta */
        .card-footer {
            padding: 1rem 2rem;
            background-color: #F8F6F4;
            border-top: 1px solid #F2EAE4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
        }

        .card-footer a {
            color: #9B1B22;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.15s ease;
        }

        .card-footer a:hover {
            color: #7A151A;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- Muestra errores si el correo ya existe en otro estudiante -->
        {% if messages %}
        <ul class="messages-list">
            {% for m in messages %}
            <li>{{ m }}</li>
            <script>
                alert("{{ m }}");
            </script>
            {% endfor %}
        </ul>
        {% endif %}

        <!-- Tarjeta del Formulario -->
        <div class="card">
            
            <div class="card-header">
                <div class="icon-badge">
                    <!-- Icono de edición (Lápiz) -->
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                    </svg>
                </div>
                <h1>Editar información</h1>
                <p>Modifica los datos permitidos del estudiante.</p>
            </div>

            <div class="card-body">
                <!-- novalidate permite que nuestra propia alerta valide el formato del correo -->
                <form id="formEditar" method="post" novalidate>
                    {% csrf_token %}

                    <!-- CAMPOS BLOQUEADOS (Si el administrador intenta cambiarlos, sale alerta) -->
                    <p>
                        <label>Cédula:</label>
                        <input type="text" value="{{ estudiante.cedula }}" readonly class="input-readonly"
                               onclick="alertaNoPermitido('la cédula')">
                    </p>

                    <p>
                        <label>Nombre:</label>
                        <input type="text" value="{{ estudiante.nombre }}" readonly class="input-readonly"
                               onclick="alertaNoPermitido('el nombre')">
                    </p>

                    <p>
                        <label>Apellido:</label>
                        <input type="text" value="{{ estudiante.apellido }}" readonly class="input-readonly"
                               onclick="alertaNoPermitido('el apellido')">
                    </p>

                    <p>
                        <label>Fecha y hora de registro:</label>
                        <input type="text" value="{{ estudiante.fecha_registro|date:'d/m/Y H:i' }}" readonly class="input-readonly"
                               onclick="alertaNoPermitido('la fecha de registro')">
                    </p>

                    <hr class="divider">

                    <!-- CAMPOS PERMITIDOS PARA EDITAR (Correo, Edad y Carrera) -->
                    <p>
                        <label for="correo">Correo:</label>
                        <input type="email" id="correo" name="correo" value="{{ estudiante.correo }}" required>
                    </p>

                    <p>
                        <label for="edad">Edad:</label>
                        <input type="number" id="edad" name="edad" value="{{ estudiante.edad }}" required>
                    </p>

                    <p>
                        <label for="carrera">Carrera:</label>
                        <select id="carrera" name="carrera" required>
                            {% for codigo, nombre_carrera in estudiante.CARRERAS %}
                                <option value="{{ codigo }}" {% if estudiante.carrera == codigo %}selected{% endif %}>
                                    {{ nombre_carrera }}
                                </option>
                            {% endfor %}
                        </select>
                    </p>

                    <button type="submit" class="btn-submit">Guardar cambios</button>
                </form>
            </div>

            <div class="card-footer">
                <a href="{% url 'lista' %}">Cancelar y volver a la lista</a>
            </div>

        </div>
    </div>

    <script>
        // 1. Alerta cuando intenta modificar un campo no permitido
        function alertaNoPermitido(campo) {
            alert("No está permitido modificar " + campo + " del estudiante. Solo puedes editar correo, edad y carrera.");
        }

        // 2. Validación al dar clic en Guardar
        document.getElementById('formEditar').addEventListener('submit', function(event) {
            const correo = document.getElementById('correo').value.trim();
            const edad = parseInt(document.getElementById('edad').value.trim(), 10);

            // Verifica que el correo tenga formato válido (texto@dominio.extension)
            const formatoCorreo = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!formatoCorreo.test(correo)) {
                event.preventDefault(); // Evita que se guarde
                alert("El correo ingresado no tiene un formato permitido (ejemplo: estudiante@correo.com).");
                return;
            }

            // Respeta la misma regla de forms.py (mínimo 16 años)
            if (isNaN(edad) || edad < 16) {
                event.preventDefault();
                alert("La edad ingresada no es válida. El estudiante debe tener al menos 16 años.");
                return;
            }
        });
    </script>
</body>
</html>
