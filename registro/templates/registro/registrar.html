{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de estudiantes</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Reset & Base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #1A1A18; /* Tono oscuro basado en las togas */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            
            /* Fondo de pantalla con tu imagen local */
            background-image: url("{% static 'img/djangoimg.jpg' %}");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        /* Mensajes de Django */
        .messages-list {
            list-style: none;
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .messages-list li {
            padding: 0.875rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            background-color: #F4FBF6;
            color: #1B5E20;
            border: 1px solid #C8E6C9;
        }

        /* Tarjeta del formulario */
        .card {
            background: #FCFBF9; /* Blanco cálido del edificio */
            border-radius: 0.75rem;
            border: 1px solid #F2EAE4; /* Borde suave inspirado en el terracota */
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            padding: 2rem 2rem 1rem 2rem;
            background: linear-gradient(to bottom, #FFFFFF, #FCFBF9);
            border-bottom: 1px solid #F2EAE4;
        }

        .icon-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 0.5rem;
            background-color: #FDECEE; /* Fondo rojizo muy claro */
            color: #9B1B22; /* Rojo carmesí de las estolas */
            margin-bottom: 1rem;
        }

        .icon-badge svg {
            width: 22px;
            height: 22px;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: #1A1A18;
            letter-spacing: -0.025em;
            margin-bottom: 0.25rem;
        }

        .card-header p {
            font-size: 0.8125rem;
            color: #6D6863;
        }

        /* Cuerpo del formulario */
        .card-body {
            padding: 1.5rem 2rem;
        }

        /* Estilos para los campos generados por Django */
        form p {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
        }

        form label {
            font-size: 0.8125rem;
            font-weight: 600;
            color: #4A4642;
            margin-bottom: 0.35rem;
        }

        form input[type="text"],
        form input[type="email"],
        form input[type="password"],
        form input[type="number"],
        form select,
        form textarea {
            width: 100%;
            padding: 0.65rem 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid #D6CEC8;
            background-color: #FFFFFF;
            color: #1A1A18;
            font-size: 0.875rem;
            font-family: inherit;
            transition: all 0.15s ease;
        }

        form input:focus,
        form select:focus,
        form textarea:focus {
            outline: none;
            border-color: #9B1B22;
            box-shadow: 0 0 0 3px rgba(155, 27, 34, 0.12);
        }

        form .helptext {
            font-size: 0.75rem;
            color: #6D6863;
            margin-top: 0.25rem;
        }

        form .errorlist {
            color: #D32F2F;
            font-size: 0.75rem;
            margin-top: 0.25rem;
            list-style: none;
        }

        /* Botón Guardar */
        .btn-submit {
            width: 100%;
            padding: 0.75rem;
            background-color: #9B1B22; /* Rojo carmesí principal */
            color: #FFFFFF;
            font-size: 0.875rem;
            font-weight: 600;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.15s ease, transform 0.1s ease;
            margin-top: 0.5rem;
            box-shadow: 0 2px 4px rgba(155, 27, 34, 0.2);
        }

        .btn-submit:hover {
            background-color: #7A151A; /* Rojo más oscuro al pasar el ratón */
        }
        
        .btn-submit:active {
            transform: scale(0.99);
        }

        /* Pie de la tarjeta */
        .card-footer {
            padding: 1rem 2rem 1.5rem 2rem;
            background-color: #F8F6F4;
            border-top: 1px solid #F2EAE4;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
        }

        .card-footer a {
            color: #9B1B22;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            transition: color 0.15s ease;
        }

        .card-footer a:hover {
            color: #7A151A;
            text-decoration: underline;
        }

        .footer-badge {
            color: #8C867F;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="container">

        {% if messages %}
        <ul class="messages-list">
            {% for m in messages %}
            <li>{{ m }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        <div class="card">
            <div class="card-header">
                <div class="icon-badge">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 3L1 9L12 15L21 10.09V17H23V9M5 13.18V17.18C5 19.94 8.13 22 12 22C15.87 22 19 19.94 19 17.18V13.18L12 17L5 13.18Z"/>
                    </svg>
                </div>
                <h1>Registro de estudiantes</h1>
                <p>Completa los campos para registrar un nuevo alumno en el sistema.</p>
            </div>

            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    {{ form.as_p }}

                    <button type="submit" class="btn-submit">
                        Guardar
                    </button>
                </form>
            </div>

            <div class="card-footer">
                <a href="{% url 'lista' %}">&larr; Ver registros</a>
            </div>
        </div>

    </div>
</body>
</html>
